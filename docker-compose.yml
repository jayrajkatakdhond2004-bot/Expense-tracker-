services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017' # exposed so `npm run dev` on the host can use this database
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/expense-tracker
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      # The local stack is served over plain HTTP; use true behind HTTPS.
      COOKIE_SECURE: 'false'
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
